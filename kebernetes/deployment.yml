apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache-deployment
spec:
  replicas: 5
  selector:
    matchLabels:
      app: php-apache
  template:
    metadata:
      labels:
        app: php-apache
    spec:
      containers:
      - name: php-apache-container
        image: php:7.4-apache
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache-service
spec:
  type: NodePort
  selector:
    app: php-apache
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080

